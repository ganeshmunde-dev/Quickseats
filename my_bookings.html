<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickSeats — My Bookings</title>
  <link rel="stylesheet" href="assets/css/styles.css?v=3.1">
  <style>
    .bookings-wrapper {
      max-width: 900px;
      margin: 2rem auto;
      padding: 0 1rem;
    }
    .booking-card {
      background: white;
      border-radius: 8px;
      padding: 1.5rem;
      margin-bottom: 1rem;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
      border: 1px solid #e5e7eb;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }
    .booking-info h3 {
      margin-bottom: 0.5rem;
      color: #111827;
    }
    .booking-info p {
      font-size: 0.9rem;
      color: #4b5563;
      margin-bottom: 0.25rem;
    }
    .booking-actions {
      text-align: right;
    }
    .status-badge {
      display: inline-block;
      background: #d1fae5;
      color: #065f46;
      padding: 0.25rem 0.75rem;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }
    .btn-secondary {
      background-color: #f1f5f9;
      color: #0f172a;
      border: 1px solid #cbd5e1;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.85rem;
      transition: background-color 0.2s;
    }
    .btn-secondary:hover {
      background-color: #e2e8f0;
    }
    #no-bookings {
      text-align: center;
      padding: 3rem;
      background: white;
      border-radius: 8px;
      border: 1px solid #e5e7eb;
    }
  </style>
</head>
<body>
  <!-- NAVBAR -->
  <nav class="navbar">
    <div class="nav-brand">
      <img src="assets/img/bus logo2.png" alt="QuickSeats Logo" class="nav-logo-img" style="height:36px;">
      QuickSeats
    </div>
    <div class="nav-links">
      <a href="home.html">Home</a>
      <a href="my_bookings.html">My Bookings</a>
      <a href="sso-login.php?role=admin">Admin</a>
      <div id="nav-user-area"></div>
    </div>
    <button class="hamburger" id="hamburger-btn">☰</button>
  </nav>

  <div class="mobile-nav" id="mobile-menu">
    <a href="home.html">Home</a>
    <a href="my_bookings.html">My Bookings</a>
    <a href="sso-login.php?role=admin">Admin</a>
    <div id="mobile-user-area"></div>
  </div>

  <div class="bookings-wrapper">
    <h2 style="margin-bottom: 1.5rem;">My Bookings</h2>
    <div id="bookings-list">
      <div class="skeleton-box"></div>
      <div class="skeleton-box" style="width: 80%"></div>
      <div class="skeleton-box" style="width: 90%"></div>
    </div>
  </div>

  <script>
    const API_BASE = 'api';

    // UI Handlers (Mobile Nav)
    const hamburger = document.getElementById('hamburger-btn');
    const mobileMenu = document.getElementById('mobile-menu');
    if (hamburger && mobileMenu) {
      hamburger.addEventListener('click', () => {
        mobileMenu.classList.toggle('open');
      });
    }

    function updateUserUI() {
      const user = localStorage.getItem('qs_user');
      const desktopArea = document.getElementById('nav-user-area');
      const mobileArea = document.getElementById('mobile-user-area');
      
      if (!user) {
        window.location.href = 'home.html';
        return;
      }
      
      const loggedInHTML = `
        <span style="color: white; margin-right: 1rem; font-size: 0.85rem;">👤 ${user}</span>
        <button class="btn-login" onclick="logoutUser()">Logout</button>
      `;
      if (desktopArea) desktopArea.innerHTML = loggedInHTML;
      if (mobileArea) mobileArea.innerHTML = `<a href="#" onclick="logoutUser()">Logout (${user})</a>`;
    }

    window.logoutUser = function() {
      localStorage.removeItem('qs_user');
      window.location.href = 'home.html';
    };

    async function loadBookings() {
      const list = document.getElementById('bookings-list');
      const email = localStorage.getItem('qs_user');
      if (!email) {
        list.innerHTML = `<p style="color:red;">Please log in to view your bookings.</p>`;
        return;
      }
      try {
        const res = await fetch(`${API_BASE}/my_bookings.php?email=${encodeURIComponent(email)}`);
        const data = await res.json();

        if (!res.ok || !data.success) throw new Error(data.error || 'Failed to load bookings.');

        if (data.bookings.length === 0) {
          list.innerHTML = `
            <div id="no-bookings">
              <h3>No Bookings Found</h3>
              <p>You haven't booked any tickets yet.</p>
              <br>
              <a href="home.html" class="btn-secondary" style="text-decoration:none;">Search Buses</a>
            </div>
          `;
          return;
        }

        list.innerHTML = '';
        data.bookings.forEach(b => {
          const card = document.createElement('div');
          card.className = 'booking-card';
          card.innerHTML = `
            <div class="booking-info">
              <h3>${b.route_from} → ${b.route_to}</h3>
              <p><strong>Date & Time:</strong> ${b.travel_date} | ${b.travel_time}</p>
              <p><strong>Passenger:</strong> ${b.passenger_name} | <strong>Seats:</strong> ${b.seats_booked}</p>
              <p><strong>Bus:</strong> ${b.bus_type}</p>
            </div>
            <div class="booking-actions">
              <span class="status-badge">PAID</span>
              <div style="font-size: 1.25rem; font-weight: bold; margin-bottom: 0.5rem;">₹${b.total_price}</div>
              <button class="btn-secondary" onclick="window.open('success.html?id=${b.id}&email=' + encodeURIComponent(localStorage.getItem('qs_user') || ''), '_blank')">View Receipt</button>
            </div>
          `;
          list.appendChild(card);
        });
      } catch (err) {
        list.innerHTML = `<p style="color: red;">${err.message}</p>`;
      }
    }

    updateUserUI();
    loadBookings();
  </script>
</body>
</html>
